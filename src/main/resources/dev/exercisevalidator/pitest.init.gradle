// Adds PIT mutation testing to an exercise's tests build without editing its build files (DECISIONS.md D3).
// Usage: ./gradlew pitest --init-script <this file>
initscript {
    repositories {
        gradlePluginPortal()
    }
    dependencies {
        classpath 'info.solidsoft.gradle.pitest:gradle-pitest-plugin:1.19.0'
    }
}

// 'pkg/Foo.java' becomes 'pkg.Foo'.
def classNames = { sourceSet ->
    def names = [] as Set
    sourceSet.java.asFileTree.visit { details ->
        if (!details.directory && details.name.endsWith('.java')) {
            names << details.relativePath.pathString.replaceAll(/\.java$/, '').replace('/', '.')
        }
    }
    names
}
// 'pkg.Foo*' also covers nested classes.
def classGlobs = { sourceSet -> classNames(sourceSet).collect { it + '*' } as Set }

allprojects {
    // Init scripts cannot use plugin ids, so the plugin is applied by class.
    pluginManager.withPlugin('java') {
        apply plugin: info.solidsoft.gradle.pitest.PitestPlugin

        pitest {
            pitestVersion = '1.30.2'
            junit5PluginVersion = '1.2.3'
            // PIT refuses a catch-all filter, and the exercise's package is not known up front,
            // so the class names are read from the source sets: main = code to mutate, test = tests to run.
            targetClasses = provider { classGlobs(sourceSets.main) }
            targetTests = provider { classGlobs(sourceSets.test) }
            // STRONGER removes conditions instead of negating them. Only "null check removed" shows a weak
            // null test; the negated check is killed by every test that passes a valid argument.
            mutators = ['STRONGER']
            // Run mutants in the same JVM setup as the graded tests (Ares agent, --add-opens).
            // Args with a comma are dropped: PIT splits its JVM args on commas, and the only such arg is
            // the JaCoCo coverage agent, which PIT replaces with its own coverage anyway.
            jvmArgs = provider { tasks.named('test').get().allJvmArgs.findAll { !it.contains(',') } }
            outputFormats = ['XML', 'HTML']
            timestampedReports = false
            threads = 1
            verbose = providers.gradleProperty('pitVerbose').isPresent()
        }

        // Ares 1 (artemis-java-test-sandbox) guards the tests with a security manager. It forbids code outside its
        // trusted list to load 'sun.*' classes, and PIT's coverage probes, which PIT adds to the solution's classes,
        // live in 'sun.pitest'. It also distrusts PIT's own frames on the stack once a mutant is running. Without help
        // every test fails with a SecurityException before PIT has made a single mutant.
        // So, for this PIT run only, Ares is told to trust the solution's classes and PIT, through its own system
        // properties. 'ares.gradle.ignore' is needed with it: Ares otherwise rejects a trusted package that
        // build.gradle does not protect, and build.gradle is not ours to edit.
        // The properties travel in JAVA_TOOL_OPTIONS because PIT splits its JVM args on commas (see above), and
        // PIT's test JVMs inherit the environment of this task. Ares 2 has no security manager and needs none of this.
        tasks.withType(info.solidsoft.gradle.pitest.PitestTask).configureEach {
            doFirst {
                def ares1 = configurations.testRuntimeClasspath.resolvedConfiguration.resolvedArtifacts
                        .any { it.moduleVersion.id.name == 'artemis-java-test-sandbox' }
                if (ares1) {
                    def trusted = (['org.pitest'] + classNames(sourceSets.main)).join(',')
                    def inherited = System.getenv('JAVA_TOOL_OPTIONS')
                    environment 'JAVA_TOOL_OPTIONS', (inherited ? inherited + ' ' : '') +
                            "-Dares.gradle.ignore=true -Dares.security.trustedpackages=${trusted}"
                    println 'VALIDATOR_PIT_ARES1_TRUSTED=true'
                }
            }
        }
    }
}
