# Ares 2 security policy for the tests of this repository, referenced by @Policy in the test classes.
# Docs: https://ls1intum.github.io/Ares2/instructor/policy-reference
# Style A tests do not reference this policy (no @Policy annotation); it is kept because the Artemis
# template always ships it. Add every new test class below, otherwise Ares treats it like student code and blocks it.
thisPolicyFileCompliesToThePolicyVersion: 1
regardingTheSupervisedCode:
  theFollowingProgrammingLanguageConfigurationIsUsed: JAVA_USING_GRADLE_ARCHUNIT_AND_ASPECTJ
  theSupervisedCodeUsesTheFollowingPackage: "com.example.arraymax"
  theMainClassInsideThisPackageIs: "ArrayMax"
  theFollowingClassesAreTestClasses:
    - "com.example.arraymax.ArrayMaxTest"
  theFollowingResourceAccessesArePermitted:
    regardingFileSystemInteractions: [ ]
    regardingNetworkConnections: [ ]
    regardingCommandExecutions: [ ]
    regardingThreadCreations: [ ]
    regardingPackageImports: [ ]
    regardingTimeouts: [ ]
